name: Sync Otodom Listings
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - run: python -u scraper.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add listings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update listings" && git push)
